name: Build CARAC TIMER Display

on:
  push:
    branches: ["main"]
    paths:
      - "firmware/CARAC_TIMER_DISPLAY_ESP32S3.ino"
      - "web/CARAC_TIMER_REGIE_V1_7_2_EXACT_EMBED.html"
      - ".github/workflows/build-display.yml"
  workflow_dispatch:

jobs:
  build-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit GFX Library"

      - name: Prepare Waveshare HUB75 sources and exact V1.7.2 web UI
        run: |
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-RGB-Matrix.git /tmp/waveshare
          mkdir -p /tmp/CaracTimerDisplay
          cp firmware/CARAC_TIMER_DISPLAY_ESP32S3.ino /tmp/CaracTimerDisplay/CaracTimerDisplay.ino
          cp /tmp/waveshare/example/arduino_v3.3.7/01_SimpleTestShapes/ESP32-HUB75-MatrixPanel-I2S-DMA.cpp /tmp/CaracTimerDisplay/
          cp /tmp/waveshare/example/arduino_v3.3.7/01_SimpleTestShapes/ESP32-HUB75-MatrixPanel-I2S-DMA.h /tmp/CaracTimerDisplay/
          cp /tmp/waveshare/example/arduino_v3.3.7/01_SimpleTestShapes/ESP32-HUB75-MatrixPanel-leddrivers.cpp /tmp/CaracTimerDisplay/
          cp /tmp/waveshare/example/arduino_v3.3.7/01_SimpleTestShapes/ESP32-HUB75-VirtualMatrixPanel_T.hpp /tmp/CaracTimerDisplay/
          cp -r /tmp/waveshare/example/arduino_v3.3.7/01_SimpleTestShapes/platforms /tmp/CaracTimerDisplay/

          python3 - <<'PY'
          from pathlib import Path
          import gzip
          src=Path('web/CARAC_TIMER_REGIE_V1_7_2_EXACT_EMBED.html').read_bytes()
          data=gzip.compress(src,compresslevel=9,mtime=0)
          out=Path('/tmp/CaracTimerDisplay/CARAC_TIMER_WEB_GZIP.h')
          with out.open('w',encoding='utf-8') as f:
              f.write('#pragma once\n#include <Arduino.h>\n')
              f.write(f'const size_t CARAC_WEB_GZ_LEN = {len(data)};\n')
              f.write('const uint8_t CARAC_WEB_GZ[] PROGMEM = {\n')
              for i in range(0,len(data),24):
                  f.write('  '+','.join(f'0x{b:02x}' for b in data[i:i+24])+',\n')
              f.write('};\n')
          print('Embedded UI gzip bytes:',len(data))
          PY

      - name: Compile
        run: |
          mkdir -p build
          FQBN="esp32:esp32:waveshare_esp32_s3_rgb_matrix"
          echo "Using $FQBN"
          arduino-cli compile --fqbn "$FQBN" --output-dir "$GITHUB_WORKSPACE/build" /tmp/CaracTimerDisplay
          cp build/CaracTimerDisplay.ino.bin build/CARAC_TIMER_DISPLAY_V1_8_0_EXACT_OTA.bin
          cp firmware/CARAC_TIMER_DISPLAY_ESP32S3.ino build/CARAC_TIMER_DISPLAY_V1_8_0_EXACT.ino
          cp web/CARAC_TIMER_REGIE_V1_7_2_EXACT_EMBED.html build/CARAC_TIMER_REGIE_V1_7_2_EXACT_INTERFACE.html

      - name: Upload OTA
        uses: actions/upload-artifact@v4
        with:
          name: CARAC_TIMER_DISPLAY_V1_8_0_EXACT_OTA
          path: |
            build/CARAC_TIMER_DISPLAY_V1_8_0_EXACT_OTA.bin
            build/CARAC_TIMER_DISPLAY_V1_8_0_EXACT.ino
            build/CARAC_TIMER_REGIE_V1_7_2_EXACT_INTERFACE.html
          if-no-files-found: error
